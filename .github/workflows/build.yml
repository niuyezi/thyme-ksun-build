name: thyme PixelOS KernelSU-Next kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repository"
        required: true
        type: string
        default: "https://github.com/Flicker-Android-Devices/kernel_xiaomi_sm8250"
      kernel_ref:
        description: "Kernel branch/tag/commit SHA (default = exact commit from device uname)"
        required: true
        type: string
        default: "e7dc99d5350d3f443946af44b196c9fa6f2cb02a"
      defconfig:
        description: "Defconfig name under arch/arm64/configs/"
        required: true
        type: string
        default: "thyme_defconfig"
      enable_ksu:
        description: "Replace built-in KernelSU with KernelSU-Next"
        required: true
        type: boolean
        default: true
      ksun_ref:
        description: "KernelSU-Next branch/tag/commit"
        required: true
        type: string
        default: "legacy"
      clang_version:
        description: "AOSP prebuilt clang directory name"
        required: true
        type: string
        default: "clang-r596125"
      build_baseline:
        description: "Build unmodified baseline first (already verified; off by default to save ~18 min)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# All JS actions below are pinned to node24 builds (checkout v7 / upload-artifact v7).
# This is a belt-and-braces switch so no action can silently fall back to node20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_REF: ${{ inputs.kernel_ref }}
      DEFCONFIG: ${{ inputs.defconfig }}
      KSU_REF: ${{ inputs.ksun_ref }}
      ENABLE_KSU: ${{ inputs.enable_ksu }}
      CLANG_VERSION: ${{ inputs.clang_version }}
    steps:
      - name: Checkout this workflow repo
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential curl git ca-certificates zip unzip \
            libssl-dev libelf-dev libncurses-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            python3 python-is-python3 zstd lz4 cpio file
          # The 4.19 kernel Makefile hardcodes "python2" for mkdtboimg.py.
          printf '#!/bin/sh\nexec python3 "$@"\n' | sudo tee /usr/local/bin/python2 > /dev/null
          sudo chmod +x /usr/local/bin/python2
          python2 --version

      - name: Clone kernel source
        run: |
          set -euo pipefail
          mkdir -p kernel
          git -C kernel init -q
          git -C kernel remote add origin "$KERNEL_REPO"
          git -C kernel fetch --depth 1 origin "$KERNEL_REF"
          git -C kernel checkout -q FETCH_HEAD
          echo "kernel HEAD: $(git -C kernel rev-parse HEAD)"
          echo "kernel version: $(make -C kernel kernelversion)"
          test -f "kernel/arch/arm64/configs/$DEFCONFIG" || {
            echo "Defconfig not found: kernel/arch/arm64/configs/$DEFCONFIG" >&2
            exit 1
          }
          grep -E '^CONFIG_(LOCALVERSION|IKCONFIG|KSU)=' \
            "kernel/arch/arm64/configs/$DEFCONFIG" || true

      - name: Get AOSP clang toolchain
        run: |
          set -euo pipefail
          mkdir -p toolchains
          git clone --depth 1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchains/clang-aosp
          git -C toolchains/clang-aosp sparse-checkout set "$CLANG_VERSION"
          CLANG_BIN="$GITHUB_WORKSPACE/toolchains/clang-aosp/$CLANG_VERSION/bin"
          test -x "$CLANG_BIN/clang" || {
            echo "clang not found at $CLANG_BIN/clang" >&2
            ls -la "$GITHUB_WORKSPACE/toolchains/clang-aosp" >&2 || true
            exit 1
          }
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          export PATH="$CLANG_BIN:$PATH"
          clang --version | head -n 2
          ld.lld --version | head -n 1
          aarch64-linux-gnu-gcc --version | head -n 1

      - name: Get Python3 mkdtboimg
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fLSs \
            "https://raw.githubusercontent.com/PixelOS-AOSP/android_system_libufdt/seventeen/utils/src/mkdtboimg.py" \
            -o tools/mkdtboimg.py
          python3 -m py_compile tools/mkdtboimg.py
          head -n 1 tools/mkdtboimg.py
          MKDTBO_EXT="$GITHUB_WORKSPACE/tools/mkdtboimg.py"
          echo "MKDTBO_EXT=$MKDTBO_EXT" >> "$GITHUB_ENV"

      # Rebuild the KSU config from the device's own /proc/config.gz every run, so
      # a stale or hand-edited input/device-ksun.config can never break the build.
      - name: Prepare KernelSU-Next config
        if: ${{ inputs.enable_ksu }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('input/device.config').read_text(encoding='utf-8', errors='replace').splitlines()
          def is_ksu(l):
              s = l.strip()
              if s.startswith('# ') and ' is not set' in s:
                  return s.split()[1].startswith('CONFIG_KSU')
              if '=' in s and not s.startswith('#'):
                  return s.split('=', 1)[0].startswith('CONFIG_KSU')
              return False
          out = [l for l in src if not is_ksu(l)]
          # 4.19 is non-GKI: use syscall-table hook, NOT the kprobes hook
          # (Kconfig says kprobes hook must not be used below 5.10). Strip any
          # stale forced kprobes lines left by earlier config generations.
          forced = {'CONFIG_KPROBES=y', 'CONFIG_KPROBE_EVENTS=y', 'CONFIG_KRETPROBES=y'}
          out = [l for l in out if l.strip() not in forced]
          out += [
              'CONFIG_KSU=y',
              '# CONFIG_KSU_MANUAL_HOOK is not set',
              '# CONFIG_KSU_KPROBES_HOOK is not set',
              'CONFIG_KSU_SYSCALL_TABLE_HOOK=y',
          ]
          Path('input/device-ksun.config').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('wrote input/device-ksun.config:', len(out), 'lines')
          PY
          echo "--- KSU config tail ---"
          tail -n 8 input/device-ksun.config
          echo "--- must be empty: forced KPROBES ---"
          grep -n '^CONFIG_KPROBES=y' input/device-ksun.config || echo "OK: no forced KPROBES"
          echo "--- must be empty: duplicate CONFIG_KSU ---"
          test "$(grep -c '^CONFIG_KSU=y' input/device-ksun.config)" = "1" && echo "OK: single CONFIG_KSU=y"

      - name: Build unmodified baseline
        if: ${{ inputs.build_baseline }}
        working-directory: kernel
        run: |
          set -euo pipefail
          MAKE_ARGS="O=../out/base ARCH=arm64 LLVM=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- MKDTBO_EXT=$MKDTBO_EXT"
          mkdir -p ../out/base
          if test -f ../input/device.config; then
            echo "Using exact config extracted from device /proc/config.gz"
            cp ../input/device.config ../out/base/.config
            make $MAKE_ARGS olddefconfig
          else
            make $MAKE_ARGS "$DEFCONFIG"
          fi
          make -j"$(nproc)" $MAKE_ARGS 2>&1 | tee ../build-baseline.log
          for f in Image Image.gz; do
            test -f "../out/base/arch/arm64/boot/$f" && sha256sum "../out/base/arch/arm64/boot/$f" >> ../baseline.sha256
          done
          cat ../baseline.sha256

      - name: Reset kernel tree before integration
        if: ${{ inputs.enable_ksu }}
        working-directory: kernel
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fdx
          rm -rf drivers/kernelsu

      # The Flicker "seventeen" tree ships the ORIGINAL KernelSU manual hooks
      # as committed source (e.g. drivers/tty/pty.c calls ksu_handle_devpts()
      # under #ifdef CONFIG_KSU). `git reset --hard` cannot undo committed
      # code. Step 9 deletes drivers/kernelsu/ (the implementation), so every
      # such inline call becomes an undefined symbol at link time once KSU-Next
      # is integrated (run #6: ld.lld: undefined symbol: ksu_handle_devpts).
      # KSU-Next uses syscall-table/LSM hooks and needs none of these. Strip
      # all pure hook blocks generically instead of hardcoding one symbol.
      - name: Remove legacy KernelSU inline hooks
        if: ${{ inputs.enable_ksu }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          root = Path('kernel')
          skip_dirs = {'kernelsu', 'KernelSU-Next', 'out', '.git'}

          # Matches a complete "#ifdef CONFIG_KSU ... #endif" (also
          # "#if defined(CONFIG_KSU)") block whose body is only hook lines.
          block = re.compile(
              r'(?m)^[ \t]*#(?:ifdef[ \t]+CONFIG_KSU'
              r'|if[ \t]+defined\s*\(\s*CONFIG_KSU\s*\))[ \t]*\n'
              r'((?:(?![ \t]*#(?:endif|else|elif|ifdef|ifndef)\b)[^\n]*\n)+?)'
              r'[ \t]*#endif[^\n]*\n')

          targets = []
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames[:] = [d for d in dirnames if d not in skip_dirs]
              for fn in filenames:
                  if fn.endswith(('.c', '.h')):
                      targets.append(Path(dirpath) / fn)

          def is_pure_hook_lines(body):
              lines = [l.strip() for l in body.splitlines() if l.strip()]
              if not lines:
                  return False
              return all('ksu_handle_' in l and l.endswith(';')
                         and not l.startswith('//') for l in lines)

          changed = []
          for f in targets:
              t = f.read_text(encoding='utf-8', errors='replace')
              if 'ksu_handle_' not in t:
                  continue
              new = block.sub(lambda m: '' if is_pure_hook_lines(m.group(1))
                              else m.group(0), t)
              if new != t:
                  f.write_text(new, encoding='utf-8')
                  changed.append(f.relative_to(root).as_posix())

          print('=== removed pure #ifdef CONFIG_KSU hook blocks from ===')
          for r in changed:
              print('  ', r)
          if not changed:
              print('   (none)')

          # Audit: list any ksu_handle_* line still left in non-KSU sources.
          remaining = []
          for f in targets:
              t = f.read_text(encoding='utf-8', errors='replace')
              for i, l in enumerate(t.splitlines(), 1):
                  if 'ksu_handle_' in l:
                      remaining.append(f'{f.relative_to(root).as_posix()}:{i}: {l.strip()[:150]}')
          print('=== remaining ksu_handle_* lines in kernel tree ===')
          for r in remaining[:60]:
              print('  ', r)
          if not remaining:
              print('   (none)')

          pty = root / 'drivers' / 'tty' / 'pty.c'
          assert pty.is_file(), 'drivers/tty/pty.c missing'
          assert 'ksu_handle_devpts' not in pty.read_text(encoding='utf-8', errors='replace'), \
              'legacy ksu_handle_devpts hook still present in pty.c'
          print('OK: pty.c no longer references ksu_handle_devpts')
          PY

      - name: Integrate KernelSU-Next
        if: ${{ inputs.enable_ksu }}
        run: |
          set -euo pipefail
          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" \
            -o ksu_setup.sh
          echo "setup.sh sha256:"
          sha256sum ksu_setup.sh
          (cd kernel && sh ../ksu_setup.sh "$KSU_REF")

          test -f kernel/drivers/kernelsu/Makefile
          grep -q 'obj-$(CONFIG_KSU)' kernel/drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> kernel/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' kernel/drivers/Kconfig || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig

          echo "--- KSU driver wiring ---"
          ls -ld kernel/drivers/kernelsu
          head -n 5 kernel/drivers/kernelsu/Makefile
          grep -n 'kernelsu' kernel/drivers/Makefile || true
          grep -n 'kernelsu' kernel/drivers/Kconfig || true

      # KernelSU-Next legacy assumes kernels <5.8 lack copy_to_kernel_nofault()
      # and that can_umount() is spelled "static int". This PixelOS 4.19 tree
      # backported copy_to_kernel_nofault() and uses "static inline int
      # can_umount", so the shipped Kbuild injects a duplicate definition and
      # the <5.8 shim macro rewrites the uaccess.h prototype into garbage.
      # Both were the real cause of run #4 "Build final kernel" exit 2.
      - name: Patch KSU-Next for 4.19 compatibility
        if: ${{ inputs.enable_ksu }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          ksu = Path('kernel/drivers/kernelsu')
          assert ksu.is_dir(), 'KSU driver dir missing'
          real = ksu.resolve()
          print('KSU source dir:', real)
          kb = real / 'Kbuild'
          pm = real / 'hook' / 'patch_memory.c'
          assert kb.is_file(), 'Kbuild missing'
          assert pm.is_file(), 'hook/patch_memory.c missing'

          # Fix 1: KSU detects can_umount() with "^static int can_umount", but
          # this 4.19 tree has "static inline int can_umount" -> Kbuild injects
          # a duplicate definition into fs/namespace.c -> redefinition error.
          t = kb.read_text(encoding='utf-8')
          pat1 = re.compile(r'(grep\s+-Eq\s+["\'])\^static int can_umount(["\'])')
          hits1 = pat1.findall(t)
          if len(hits1) != 1:
              print('!! can_umount guard not matched exactly once. Lines containing can_umount:')
              for i, line in enumerate(t.splitlines(), 1):
                  if 'can_umount' in line:
                      print(f'  {i}: {line}')
              raise SystemExit(f'expected 1 can_umount grep, found {len(hits1)}')
          t = pat1.sub(lambda m: m.group(1) + '^static (inline )?int can_umount' + m.group(2), t)
          kb.write_text(t, encoding='utf-8')

          # Fix 2: this 4.19 kernel backported copy_to_kernel_nofault()
          # (declared in uaccess.h, implemented in mm/maccess.c), but KSU's
          # <5.8 shim re-#defines it to probe_kernel_write(), which rewrites
          # the uaccess.h prototype into invalid C -> "type specifier missing".
          p = pm.read_text(encoding='utf-8')
          pat2 = re.compile(r'#if\s+LINUX_VERSION_CODE\s*<\s*KERNEL_VERSION\(5,\s*8,\s*0\)')
          hits2 = pat2.findall(p)
          if len(hits2) != 1:
              print('!! 5.8 version guard not matched exactly once. Lines containing KERNEL_VERSION:')
              for i, line in enumerate(p.splitlines(), 1):
                  if 'KERNEL_VERSION' in line:
                      print(f'  {i}: {line}')
              raise SystemExit(f'expected 1 version guard, found {len(hits2)}')
          p = pat2.sub('#if 0  /* 4.19 already provides copy_to_kernel_nofault() */', p)
          pm.write_text(p, encoding='utf-8')

          # Verify by reading the files back. A shell `grep` under `set -e`
          # silently kills the step when its pattern drifts from the text
          # actually written, so all verification lives here instead.
          kb_txt = kb.read_text(encoding='utf-8')
          pm_txt = pm.read_text(encoding='utf-8')
          assert '^static (inline )?int can_umount' in kb_txt, 'patch 1 did not persist'
          assert '#if 0  /* 4.19 already provides copy_to_kernel_nofault() */' in pm_txt, 'patch 2 did not persist'
          print('KSU 4.19 compatibility patches applied and verified')
          print('  patch1:', [l for l in kb_txt.splitlines() if '(inline )?int can_umount' in l][:1])
          print('  patch2:', [l for l in pm_txt.splitlines() if '#if 0' in l][:1])
          PY

      # UAPI 6 obtains the KernelSU driver fd through a reboot-magic supercall:
      #   userspace/ksud/src/ksucalls.rs: init_driver_fd()
      #     -> reboot(0xDEADBEEF, 0xCAFEBABE, 0, &fd)
      # KSUN legacy registers that reboot kprobe ONLY under KSU_KPROBES_HOOK
      # (kernel/supercall/supercall.c: register_kprobe(&reboot_kp)), but kprobes
      # cannot be used on 4.19 (Kconfig: "should not be used below 5.10", and
      # issue #1053 reports bootloops). The syscall-table scheme patches just
      # execve/execveat/faccessat/newfstatat, so without an inline reboot hook
      # the manager never gets a driver fd:
      #   "ksuctl failed: could not retrieve kernelsu driver fd"
      #   -> "Failed to grant root" / "/data/adb/ is not a regular directory"
      # Maintainer rifsxd on issue #1053: "You are missing a critical manual
      # hooks, go implement reboot hook and test again".
      #
      # This step MUST run after "Remove legacy KernelSU inline hooks" (which
      # strips #ifdef CONFIG_KSU hook blocks) and after "Integrate KernelSU-Next"
      # (which creates the ksu_handle_sys_reboot symbol). The hook must sit
      # BEFORE ns_capable()/magic checks because the manager is not root.
      - name: Add reboot supercall hook for UAPI 6 driver fd
        if: ${{ inputs.enable_ksu }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kernel/kernel/reboot.c')
          assert path.is_file(), f'missing {path}'
          text = path.read_text(encoding='utf-8', errors='replace')

          if 'ksu_handle_sys_reboot' in text:
              print('reboot hook already present, skipping')
              raise SystemExit(0)

          lines = text.splitlines(keepends=True)
          starts = [i for i, l in enumerate(lines)
                    if 'SYSCALL_DEFINE4(reboot' in l]
          assert len(starts) == 1, f'expected 1 reboot syscall, found {len(starts)}'
          start = starts[0]

          # Insert right after "int ret = 0;" in the reboot syscall body.
          anchor = None
          for j in range(start, min(start + 40, len(lines))):
              if 'int ret = 0;' in lines[j]:
                  anchor = j
                  break
          assert anchor is not None, 'int ret = 0; not found in reboot syscall'

          hook = [
              '#ifdef CONFIG_KSU\n',
              '\textern int ksu_handle_sys_reboot(int, int, unsigned int, void __user **);\n',
              '\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n',
              '#endif\n',
              '\n',
          ]
          lines[anchor + 1:anchor + 1] = hook
          path.write_text(''.join(lines), encoding='utf-8')

          # Read-back verification: a shell grep under set -e is unreliable
          # when the pattern drifts, so assert against the file we just wrote.
          out = path.read_text(encoding='utf-8', errors='replace')
          assert out.count('ksu_handle_sys_reboot') == 2, \
              'hook was not written exactly once'
          assert 'ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);' in out, \
              'hook call missing'
          i_hook = out.index('ksu_handle_sys_reboot(magic1')
          i_cap = out.index('ns_capable', i_hook)
          assert i_cap > i_hook, 'hook must precede the ns_capable() check'
          assert out.index('#ifdef CONFIG_KSU') < i_hook
          print('OK: reboot supercall hook inserted before capability checks')
          PY
          grep -n -B3 -A6 'ksu_handle_sys_reboot' kernel/kernel/reboot.c || true

      # KernelSU-Next bootstraps its module system by injecting KERNEL_SU_RC
      # ("on post-fs-data -> ksud post-fs-data") into init.rc. It does so by
      # replacing the init.rc file's f_op with read_proxy()/read_iter_proxy(),
      # which append the rc text only AFTER the original read returns 0 (EOF).
      #
      # Android init sizes its read buffer from the st_size returned by
      # fstat()/newfstat(). With the real file size it consumes exactly that
      # many bytes and stops -- it never issues the extra read that would
      # return 0, so the proxy never appends anything:
      #   -> no "on post-fs-data" section, ksud post-fs-data never runs,
      #   -> no module overlay mounts, every module appears installed but dead.
      #
      # KSUN legacy fixes this in ksu_common_newfstat_ret(), reached through
      # ksu_handle_newfstat_ret(), which adds ksu_rc_len + module_rc_len to
      # st_size so init reads past the original EOF. In kprobes builds that is
      # a kretprobe on sys_newfstat; on 4.19 we use CONFIG_KSU_SYSCALL_TABLE_HOOK
      # and the syscall table only carries execve/execveat/faccessat/newfstatat
      # (newfstatat -> ksu_handle_stat() = su-path hiding, NOT a st_size bump).
      # So fd-based sys_newfstat needs this inline manual hook.
      #
      # The kernel enforces C89 declarations (-Werror=declaration-after-statement),
      # so the extern prototype is placed at FILE SCOPE and only the call is
      # inserted into the function body (a declaration after cp_new_stat()
      # fails the build even though the logic is correct).
      #
      # Must run AFTER "Remove legacy KernelSU inline hooks" (which strips
      # #ifdef CONFIG_KSU blocks) and AFTER "Integrate KernelSU-Next" (which
      # creates the symbol). Android 17 init is 64-bit, so only the native
      # newfstat is hooked: COMPAT_SYSCALL_DEFINE2(newfstat) and fstat64 are
      # deliberately untouched (fstat64's handler is conditionally compiled
      # and would be an undefined symbol on arm64).
      - name: Add newfstat ret hook for module system (post-fs-data)
        if: ${{ inputs.enable_ksu }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Fail early (not at link time) if the KSUN tree drifted.
          ksu_src = Path('kernel/drivers/kernelsu/runtime/ksud_integration.c')
          assert ksu_src.is_file(), f'missing {ksu_src}'
          assert 'void ksu_handle_newfstat_ret(' in \
              ksu_src.read_text(encoding='utf-8', errors='replace'), \
              'KSUN no longer exports ksu_handle_newfstat_ret()'

          path = Path('kernel/fs/stat.c')
          assert path.is_file(), f'missing {path}'
          text = path.read_text(encoding='utf-8', errors='replace')

          if 'ksu_handle_newfstat_ret' in text:
              print('newfstat ret hook already present, skipping')
              raise SystemExit(0)

          lines = text.splitlines(keepends=True)
          # Anchored at line start: COMPAT_SYSCALL_DEFINE2(newfstat, ...)
          # contains the same substring and must NOT be matched.
          starts = [i for i, l in enumerate(lines)
                    if re.match(r'^[ \t]*SYSCALL_DEFINE2\(newfstat\b', l)]
          assert len(starts) == 1, \
              f'expected 1 native SYSCALL_DEFINE2(newfstat), found {len(starts)}'
          start = starts[0]

          # Insert between cp_new_stat() and "return error;" so statbuf is
          # already populated when KSUN patches st_size.
          ret_idx = None
          for j in range(start, min(start + 25, len(lines))):
              if j > start and 'SYSCALL_DEFINE' in lines[j]:
                  break
              if lines[j].strip() == 'return error;':
                  ret_idx = j
                  break
          assert ret_idx is not None, 'return error; not found in newfstat'

          # Insert from the bottom up so the earlier index stays valid.
          # Only a STATEMENT goes in the function body; the extern prototype
          # lives at file scope above the syscall (C89 / -Werror).
          call = [
              '\n',
              '#ifdef CONFIG_KSU\n',
              '\tksu_handle_newfstat_ret(&fd, &statbuf);\n',
              '#endif\n',
          ]
          lines[ret_idx:ret_idx] = call

          decl = [
              '#ifdef CONFIG_KSU\n',
              'extern void ksu_handle_newfstat_ret(unsigned int *, struct stat __user **);\n',
              '#endif\n',
          ]
          lines[start:start] = decl
          path.write_text(''.join(lines), encoding='utf-8')

          out = path.read_text(encoding='utf-8', errors='replace')
          assert out.count('ksu_handle_newfstat_ret') == 2, \
              'hook was not written exactly once'
          assert 'extern void ksu_handle_newfstat_ret(' in out, \
              'file-scope extern declaration missing'
          assert 'ksu_handle_newfstat_ret(&fd, &statbuf);' in out
          i_decl = out.index('extern void ksu_handle_newfstat_ret(')
          i_sys = out.index('SYSCALL_DEFINE2(newfstat')
          i_hook = out.index('ksu_handle_newfstat_ret(&fd')
          assert i_decl < i_sys, 'extern declaration must be at file scope'
          i_cp = out.index('cp_new_stat(&stat, statbuf)', i_sys)
          assert i_cp < i_hook, 'hook must be after cp_new_stat() in newfstat'
          assert i_hook < out.index('return error;', i_hook), \
              'hook must be before return error;'
          # The cleanup step must have run first, otherwise a future reordering
          # could strip our own #ifdef CONFIG_KSU block too.
          assert 'ksu_handle_stat' not in out, \
              'legacy ksu_handle_stat hooks still present - cleanup did not run first'
          print('OK: newfstat ret hook inserted (file-scope extern + in-body call)')
          PY
          grep -n -B4 -A6 'ksu_handle_newfstat_ret' kernel/fs/stat.c || true

      - name: Build final kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          MAKE_ARGS="O=../out/final ARCH=arm64 LLVM=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- MKDTBO_EXT=$MKDTBO_EXT"
          mkdir -p ../out/final
          if [ "$ENABLE_KSU" = "true" ] && test -f ../input/device-ksun.config; then
            echo "Using device config with KernelSU-Next options"
            cp ../input/device-ksun.config ../out/final/.config
            make $MAKE_ARGS olddefconfig
          elif test -f ../input/device.config; then
            echo "Using exact config extracted from device /proc/config.gz"
            cp ../input/device.config ../out/final/.config
            make $MAKE_ARGS olddefconfig
          else
            make $MAKE_ARGS "$DEFCONFIG"
          fi
          echo "--- resolved KSU / hook config (must show a hook =y) ---"
          grep -E '^#? ?CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK|KPROBES) ' ../out/final/.config || true
          cp ../out/final/.config ../final-defconfig.config
          make -j"$(nproc)" $MAKE_ARGS 2>&1 | tee ../build-final.log
          test -f ../out/final/arch/arm64/boot/Image
          echo "--- artifact hashes ---"
          find ../out/final/arch/arm64/boot -maxdepth 3 -type f \
            \( -name 'Image' -o -name 'Image.gz' -o -name '*.dtb' -o -name 'dtbo.img' \) \
            -exec sha256sum {} + | tee ../artifacts.sha256

      # Always run: on failure this is the only way to get the compiler error
      # without manually downloading the log archive from the Actions UI.
      - name: Collect diagnostics
        if: always()
        run: |
          set -uo pipefail
          {
            if [ ! -s build-final.log ]; then
              echo "!! build-final.log is missing or EMPTY: the final kernel build did NOT run."
              echo "!! The real failure is in a PRECEDING step (commonly 'Patch KSU-Next for 4.19 compatibility')."
              echo "!! Open that step's log in the Actions UI instead of looking for compiler errors here."
              echo
            fi
            echo "=== compiler / make errors (last 60 hits, Broken pipe noise filtered) ==="
            grep -nEi 'error:|Error [0-9]+|\$\(error|FATAL|undefined reference|No rule to make target|not found|In file included' \
              build-final.log 2>/dev/null | grep -vi 'Broken pipe' | tail -n 60 || true
            echo "=== last 80 lines of build-final.log ==="
            tail -n 80 build-final.log 2>/dev/null || true
            echo "=== resolved KSU config ==="
            grep -E '^#? ?CONFIG_(KSU|KPROBES|KRETPROBES)' final-defconfig.config 2>/dev/null || true
          } > diagnostics.txt
          echo "--- diagnostics preview ---"
          head -n 40 diagnostics.txt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: thyme-build-logs
          path: |
            build-final.log
            build-baseline.log
            diagnostics.txt
            final-defconfig.config
            input/device-ksun.config
            ksu_setup.sh
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
          retention-days: 14

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: thyme-pixelos-ksun
          path: |
            out/final/arch/arm64/boot/Image
            out/final/arch/arm64/boot/Image.gz
            out/final/arch/arm64/boot/dts/**/*.dtb
            out/final/arch/arm64/boot/dtbo.img
            final-defconfig.config
            build-final.log
            build-baseline.log
            baseline.sha256
            artifacts.sha256
            ksu_setup.sh
            input/device.config
            input/device-ksun.config
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
          retention-days: 14
